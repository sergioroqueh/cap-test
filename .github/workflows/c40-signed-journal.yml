name: C40 mock-only authenticated manifest and durable journal
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/c40_signed_journal.mjs'
      - 'scripts/test_signed_journal_c40.mjs'
      - 'scripts/c39_snapshot_transfer.mjs'
      - '.github/workflows/c40-signed-journal.yml'
      - 'docs/commercial/C40_SIGNED_JOURNAL_RESULTS.md'
permissions:
  contents: read
jobs:
  synthetic-offline:
    if: github.head_ref == 'feat/cap-commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: C40 signed manifest and fsync journal synthetic tests
        run: node --test scripts/test_signed_journal_c40.mjs
      - name: C39 transfer regression
        run: node --test scripts/test_snapshot_transfer_c39.mjs
      - name: C33 cursor regression
        run: node --test scripts/test_snapshot_cursor_c33.mjs
      - name: Cloud and credentials remain absent
        run: |
          grep -F 'export const cloudConfigured = false' src/supabase.ts
          ! grep -nE 'fetch\(|https?://|supabase\.co|SUPABASE_URL|XMLHttpRequest' scripts/c40_signed_journal.mjs scripts/test_signed_journal_c40.mjs
          ! grep -R -nE "c40_signed_journal|test_signed_journal_c40" src/
