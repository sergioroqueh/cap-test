name: C52 dependency reproducibility preflight (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c52-dependency-lock.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  dependency-lock:
    if: github.head_ref == 'feat/cap-commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate candidate lock and exact direct versions in ephemeral runner
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const p=JSON.parse(fs.readFileSync('package.json','utf8'))
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'))
          for (const section of ['dependencies','devDependencies']) {
            for (const name of Object.keys(p[section]||{})) {
              const version=lock.packages?.['node_modules/'+name]?.version
              if (!version || !/^\d+\.\d+\.\d+(?:[-+][a-zA-Z0-9.-]+)?$/.test(version))
                throw Error('Direct package has no exact lock version: '+name)
              p[section][name]=version
            }
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean frozen installation and preview compilation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:preview
          grep -F 'export const cloudConfigured = false' src/supabase.ts
          ! grep -R -l 'RUTACAP_PRIVATE_CATALOG_C14' dist
      - name: Print reproducible candidate as chunked nonsecret base64 (read-only)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          for (const [name,path] of [['MANIFEST','package.json'],['LOCK','package-lock.json']]) {
            const bytes=fs.readFileSync(path)
            const encoded=bytes.toString('base64')
            const chunks=encoded.match(/.{1,3000}/g)||[]
            console.log('C52_SNAPSHOT_BEGIN '+name+' '+chunks.length+' '+bytes.length)
            chunks.forEach((chunk,i)=>console.log('C52_SNAPSHOT_CHUNK '+name+' '+i+' '+chunk))
            console.log('C52_SNAPSHOT_END '+name)
          }
          NODE
