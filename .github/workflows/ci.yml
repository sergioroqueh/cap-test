name: Validate CAP Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate question bank and build
        run: |
          npm run build
          if grep -R -l 'RUTACAP_PRIVATE_CATALOG_C14' dist; then exit 1; fi

      - name: Guard private CLM stage contract with synthetic data only
        run: python3 scripts/audit_clm_private_stage_c20.py --self-test

      - name: Audit answer provenance coverage (aggregate only)
        run: python3 scripts/audit_answer_provenance.py

      - name: Validate C22 auth gates and local isolation
        run: node --test scripts/test_commercial_auth_c22.mjs

      - name: Verify real CAP scoring and persisted wall clock
        run: node --test scripts/test_exam_engine.mjs

      - name: Audit actual Top 100 frequency distribution
        run: node scripts/audit_top100_frequency.mjs

      - name: Validate CAP overlay isolation and answer provenance
        run: python3 scripts/test_exam_data.py

      - name: Verify R27 technical decisions and unchanged historical data
        run: |
          python3 scripts/test_technical_review_r27.py
          python3 scripts/test_technical_review_r28.py
          python3 scripts/test_technical_review_r29.py
          python3 scripts/test_technical_review_r30.py
          python3 scripts/test_technical_review_r31.py

      - name: Extract R32 transport law candidate queue (read-only)
        run: python3 scripts/select_technical_review_r32.py

      - name: Verify staged R32 evidence (no scoring changes)
        run: python3 scripts/test_technical_review_r32.py

      - name: Audit remaining source PDFs without changing scored keys
        run: python3 scripts/audit_visual_batch_candidates.py

      - name: Validate isolated CAP preview build
        run: |
          npm run build:preview
          test -f dist/index.html
          test -f dist/data/exams/editorial_casebook_r23.json
          test -f dist/data/exams/editorial_casebook_r23.csv

      - name: Install Chromium for real-browser CAP tests
        run: npx playwright install --with-deps chromium

      - name: Verify no private catalog in production or preview bundle
        run: |
          if grep -R -l 'RUTACAP_PRIVATE_CATALOG_C14' dist; then exit 1; fi
          if npx vite build --mode catalog-local; then echo 'Local build should have failed'; exit 1; fi
      - name: Test isolated private catalog with synthetic records only
        run: |
          npm run dev:catalog > /tmp/rutacap-catalog.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4188/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4188/ > /dev/null
          node --experimental-strip-types scripts/test_private_catalog_c14.mjs

      - name: C22 smoke test of local auth entry and guest on real mobile and desktop
        env:
          VITE_RUTACAP_AUTH_DEV: 'true'
          VITE_CAP_PRO_SUPABASE_URL: 'https://rutacap-dev-mock.supabase.co'
          VITE_CAP_PRO_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_mock_only_not_real'
        run: |
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/rutacap-dev-auth.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          node scripts/e2e_commercial_auth_c22.mjs

      - name: Test Focus UI in mobile and desktop browsers
        run: |
          npm run preview -- --mode cap-preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/cap-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node scripts/e2e_cap_focus.mjs

      - name: Upload C22 auth and guest screenshots (mocked local client)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap-c22-auth-guest-screenshots
          path: artifacts/cap-auth-c22/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Focus browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap-focus-mobile-desktop-screenshots
          path: artifacts/cap-focus-e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare independent commercial preview (local only)
        run: |
          printf '%s\n' 'CAP TEST PRO — preview comercial local' 'No usa la cuenta real, no sincroniza ni registra service worker.' 'Descomprime todo el ZIP en una carpeta nueva.' 'Windows: ejecuta INICIAR-PREVIEW.cmd (requiere Python 3).' 'Alternativa: python -m http.server 4178 --bind 127.0.0.1' 'Abre http://127.0.0.1:4178/ — no abras index.html directamente.' 'Versión de pruebas, no publicar ni redistribuir.' > dist/LEEME-PREVIEW.txt
          printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'echo Abre http://127.0.0.1:4178/ en el navegador. Ctrl+C para cerrar.' 'py -3 -m http.server 4178 --bind 127.0.0.1' 'pause' > dist/INICIAR-PREVIEW.cmd
          node -e "const fs=require('node:fs');fs.writeFileSync('dist/preview-build.json',JSON.stringify({mode:'cap-preview',commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,cloudSync:false,deployed:false},null,2))"

      - name: Package beta preview files (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: cap-test-pro-commercial-preview
          path: dist/
          retention-days: 14

      - name: Package CAP answer review queue
        uses: actions/upload-artifact@v4
        with:
          name: cap-exam-review
          path: |
            public/data/exams/review_queue.csv
            public/data/exams/review_hints.csv
            public/data/exams/cross_model_pending_review.csv
            public/data/exams/cross_model_pending_review.json
            public/data/exams/template_review_priority.csv
            public/data/exams/without_template_deferred.csv
            public/data/exams/template_review_summary.json
            public/data/exams/sheet_audit_index.json
            public/data/exams/sheet_audit_2400.csv
            public/data/exams/convocatorias_auditoria_r20.csv
            public/data/exams/convocatorias_auditoria_r20.json
            public/data/exams/editorial_triage_r21.json
            public/data/exams/editorial_triage_r21.csv
            public/data/exams/editorial_casebook_r22.json
            public/data/exams/editorial_casebook_r22.csv
            public/data/exams/editorial_casebook_r23.json
            public/data/exams/editorial_casebook_r23.csv
            public/data/exams/editorial_casebook_r24.json
            public/data/exams/editorial_casebook_r24.csv
            public/data/exams/editorial_progress_r24.json
            public/data/exams/editorial_decisions_r25_three.json
            public/data/exams/editorial_decisions_r25_three.csv
            public/data/exams/visual_batch_audit_2026_11_05.json
            public/data/exams/template_2025_03_29_unverified_comparison.json
            public/data/exams/alignment_2023_a_review.csv
            public/data/exams/ocr_2025_a_review.csv
            public/data/exams/index.json
            public/data/exams/technical_review_r27.json
            public/data/exams/technical_review_r27.csv
            public/data/exams/technical_review_r27_cross_model.json
            public/data/exams/technical_review_r28.json
            public/data/exams/technical_review_r28.csv
            public/data/exams/technical_review_r28_queue.json
            public/data/exams/technical_review_r29.json
            public/data/exams/technical_review_r29.csv
            public/data/exams/technical_review_r30_candidates.json
            public/data/exams/technical_review_r30.json
            public/data/exams/technical_review_r30.csv
            public/data/exams/technical_review_r31_candidates.json
            public/data/exams/technical_review_r31.json
            public/data/exams/technical_review_r31.csv
            public/data/exams/technical_review_r32_candidates.json
            public/data/exams/technical_review_r32.json
            public/data/exams/technical_review_r32.csv
            artifacts/cap-r27-ranking.json
            artifacts/cap-answer-provenance-coverage.json
          retention-days: 14
