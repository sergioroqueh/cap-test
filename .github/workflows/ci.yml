name: Validate CAP Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate question bank and build
        run: npm run build

      - name: Validate CAP overlay isolation and answer provenance
        run: python3 scripts/test_exam_data.py

      - name: Audit remaining source PDFs without changing scored keys
        run: python3 scripts/audit_visual_batch_candidates.py

      - name: Package CAP answer review queue
        uses: actions/upload-artifact@v4
        with:
          name: cap-exam-review
          path: |
            public/data/exams/review_queue.csv
            public/data/exams/review_hints.csv
            public/data/exams/cross_model_pending_review.csv
            public/data/exams/cross_model_pending_review.json
            public/data/exams/template_review_priority.csv
            public/data/exams/without_template_deferred.csv
            public/data/exams/template_review_summary.json
            public/data/exams/sheet_audit_index.json
            public/data/exams/sheet_audit_2200.csv
            public/data/exams/visual_batch_audit_2026_11_05.json
            public/data/exams/template_2025_03_29_unverified_comparison.json
            public/data/exams/alignment_2023_a_review.csv
            public/data/exams/ocr_2025_a_review.csv
            public/data/exams/index.json
          retention-days: 14
