name: RutaCAP public beta build (no deployment)
on:
  push:
    branches: [feat/cap-commercial, feat/rutacap-commerce-sprint-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate legal page generator syntax (without personal data)
        run: python3 -m py_compile ops/rutacap/legal/build_legal_pages.py
      - name: R82 security boundary checks (no network or test payments)
        run: node --test scripts/test_commercial_sprint_r82.mjs
      - name: R84 Stripe webhook runtime (synthetic, no provider connections)
        run: node --test scripts/test_r84_billing_runtime.mjs
      - name: R91 commercial sync transport (synthetic, no provider connections)
        run: node scripts/test_commercial_sync_r91.mjs
      - name: Validate commercial beta artifact
        env:
          VITE_RUTACAP_PUBLIC_AUTH: ${{ vars.RUTACAP_PUBLIC_AUTH }}
          VITE_CAP_PRO_SUPABASE_URL: ${{ vars.RUTACAP_SUPABASE_URL }}
          VITE_CAP_PRO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RUTACAP_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RUTACAP_BILLING_ENABLED: ${{ vars.RUTACAP_BILLING_ENABLED }}
          VITE_RUTACAP_EMAIL_OTP: ${{ vars.RUTACAP_EMAIL_OTP }}
          VITE_RUTACAP_GOOGLE_AUTH: ${{ vars.RUTACAP_GOOGLE_AUTH }}
          VITE_RUTACAP_PASSWORD_AUTH: ${{ vars.RUTACAP_PASSWORD_AUTH }}
        run: npm run build:launch
      - name: Test first-use beta journey in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4178 --strictPort > /tmp/rutacap-launch-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/e2e_launch_beta.mjs
      - name: Upload tested beta artifact (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: rutacap-public-beta-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
