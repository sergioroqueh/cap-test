name: R26 answer-sheet preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit candidate answer sheets against existing bank
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_exam_data.py
          python3 scripts/audit_r26_candidate_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: cap-r26-candidate-audit
          path: public/data/exams/r26_candidate_audit.json
