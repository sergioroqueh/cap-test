name: R36 snapshot reader-server HTTP interoperability (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/serverSnapshotProtocol.mjs'
      - 'src/remoteSnapshotReader.mjs'
      - 'scripts/test_server_snapshot_r36.mjs'
      - '.github/workflows/r36-snapshot-protocol.yml'
permissions:
  contents: read
jobs:
  http-interoperability:
    if: github.head_ref == 'feat/cap-commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One targeted HTTP integration test; no Supabase, DB or deploy
        run: node --test scripts/test_server_snapshot_r36.mjs
      - name: Ensure no production wiring and cloud stays OFF
        run: |
          grep -Fx 'export const cloudConfigured = false' src/supabase.ts
          ! grep -R -n 'serverSnapshotProtocol' src/App.tsx src/main.tsx src/Quiz.tsx
