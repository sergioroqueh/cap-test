name: R48 synthetic backup evidence gate (no cloud)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_r48_backup_evidence.mjs'
      - 'docs/commercial/R48_BACKUP_EVIDENCE_GATES.md'
      - '.github/workflows/r48-backup-evidence.yml'
permissions:
  contents: read
jobs:
  evidence-fixtures:
    if: github.head_ref == 'feat/cap-commercial'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic-only evidence tests
        run: node --test scripts/test_r48_backup_evidence.mjs
      - name: Verify cloud wiring stays off
        run: grep -Fx 'export const cloudConfigured = false' src/supabase.ts
